[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra
markers =
    unit: Unit testleri (mock API)
    integration: Integration testleri
    golden: Golden/Scenario testleri
    e2e: End-to-end testleri (gerçek API)
    slow: Yavaş çalışan testler
filterwarnings =
    ignore::DeprecationWarning